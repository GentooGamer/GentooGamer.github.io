<!-- Current Kotlin directional highlight -->
<radialGradient id="hi" cx="25%" cy="25%" r="50%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"></stop>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
</radialGradient>

<!-- Current Kotlin directional shadow -->
<radialGradient id="shadow" cx="25%" cy="25%" r="85%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0"></stop>
    <stop offset="50%" stop-color="#000000" stop-opacity="0"></stop>
    <stop offset="90%" stop-color="#000000" stop-opacity="0.65"></stop>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.95"></stop>
</radialGradient>

<!-- Glassy specular highlight from current Kotlin -->
<radialGradient id="glassHighlight" cx="35%" cy="35%" r="80%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"></stop>
    <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.05"></stop>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
</radialGradient>

<!-- Radio tip glow -->
<radialGradient id="tipGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F2B156" stop-opacity="0.45"></stop>
    <stop offset="45%" stop-color="#F2B156" stop-opacity="0.18"></stop>
    <stop offset="100%" stop-color="#F2B156" stop-opacity="0"></stop>
</radialGradient>

</defs>

<style>
.landfill {
    fill:#7C8FA0;
}

.scrollWrap {
    animation:scrollX 11s linear infinite;
}

@keyframes scrollX {
    from { transform:translateX(0); }
    to   { transform:translateX(-540px); }
}

/*
 * Radio waves:
 * Kotlin uses:
 *   0 → 1 over 2400 ms
 *   linear easing
 *   staggered by 0 / 500 / 1000 ms
 *
 * The SVG uses the equivalent centered scale animation.
 */
.wave {
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    animation:pulseWave 2.4s linear infinite;
}

.wave1 {
    animation-delay:0.5s;
}

.wave2 {
    animation-delay:1s;
}

@keyframes pulseWave {
    0% {
        opacity:0;
        transform:scale(0.5);
    }

    30% {
        opacity:1;
        transform:scale(0.71);
    }

    100% {
        opacity:0;
        transform:scale(1.2);
    }
}

.tipGlow {
    transform-box:fill-box;
    transform-origin:center;
    animation:tipPulse 2.4s linear infinite;
}

@keyframes tipPulse {
    0% {
        opacity:0;
        transform:scale(0.8);
    }

    30% {
        opacity:1;
        transform:scale(1);
    }

    100% {
        opacity:0;
        transform:scale(1);
    }
}
</style>


<!-- ========================================================= -->
<!-- Atmospheric Glow Halo                                    -->
