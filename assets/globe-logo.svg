<circle cx="130" cy="180" r="95" fill="none" stroke="#9FD3E8" stroke-opacity="0.1" stroke-width="6"></circle>

<circle cx="130" cy="180" r="92" fill="none" stroke="#9FD3E8" stroke-opacity="0.25" stroke-width="3"></circle>

<circle cx="130" cy="180" r="90" fill="none" stroke="#9FD3E8" stroke-opacity="0.5" stroke-width="1.5"></circle>


<!-- ========================================================= -->
<!-- Core Planet Structure                                    -->
<!-- ========================================================= -->

<g clip-path="url(#clip)">

    <!-- Ocean -->
    <circle cx="130" cy="180" r="90" fill="#0A1420"></circle>

    <!-- Seamless scrolling world map -->
    <g class="scrollWrap">

        <use href="#land" class="landfill" transform="translate(130,180) scale(0.75) translate(-360,-180)"></use>

        <use href="#land" class="landfill" transform="translate(670,180) scale(0.75) translate(-360,-180)"></use>

    </g>

    <!-- Glassy specular highlight -->
    <circle cx="130" cy="180" r="90" fill="url(#glassHighlight)"></circle>

    <!-- Directional top-left highlight -->
    <circle cx="130" cy="180" r="90" fill="url(#hi)" style="mix-blend-mode:soft-light;"></circle>

    <!-- Bottom-right directional shadow -->
    <circle cx="130" cy="180" r="90" fill="url(#shadow)" style="mix-blend-mode:multiply;"></circle>

</g>


